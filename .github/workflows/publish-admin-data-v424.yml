name: Publish Troll Engine v4.24 Admin Data Menu

on:
  push:
    branches: [main]
    paths:
      - "assets/admin-data-v424.css"
      - "assets/admin-data-v424.js"
      - "scripts/apply-admin-data-v424.py"
      - ".github/workflows/publish-admin-data-v424.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: troll-engine-admin-data-v424
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply admin data menu
        run: python3 scripts/apply-admin-data-v424.py
      - name: Validate generated page
        run: |
          test -s index.html
          grep -q 'teAdminDataV424' index.html
          grep -q 'assets/admin-data-v424.js' index.html
          grep -q 'content="4.24"' index.html
      - name: Commit published page
        run: |
          git config user.name "Troll Engine yuuki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "v4.24 is already published"
            exit 0
          fi
          git commit -m "Publish Troll Engine v4.24 Admin Data Menu"
          git pull --rebase origin main
          git push origin main
