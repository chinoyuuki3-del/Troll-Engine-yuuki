name: Publish Troll Engine v4.23 Public World

on:
  push:
    branches: [main]
    paths:
      - ".publish-v423/**"
      - "scripts/apply-public-world-v423.py"
      - ".github/workflows/publish-pages-v423.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: troll-engine-pages-v423
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Troll Public World v4.23
        run: python3 scripts/apply-public-world-v423.py

      - name: Validate generated page
        run: |
          test -s index.html
          grep -q "teOpenWorldV421Tab" index.html
          grep -q "teOpenWorldV422Finalizer" index.html
          grep -q "Public World All Peer Sync" index.html

      - name: Commit published page
        run: |
          git config user.name "Troll Engine yuuki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "v4.23 is already published."
            exit 0
          fi
          git commit -m "Publish Troll Engine v4.23 Public World"
          git pull --rebase origin main
          git push origin main
