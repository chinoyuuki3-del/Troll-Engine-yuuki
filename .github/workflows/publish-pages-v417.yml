name: Publish Troll Engine v4.17 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index (24).html"
      - "scripts/build-pages-v417.py"
      - ".publish-v417/**"
      - ".github/workflows/publish-pages-v417.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: troll-engine-pages-v417
  cancel-in-progress: false

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build root index
        run: python3 scripts/build-pages-v417.py

      - name: Validate generated page
        run: |
          test -s index.html
          grep -q "teAftVideoCampaignV417" index.html
          grep -q "ACTION: aft_video_publish" index.html

      - name: Commit published page
        run: |
          git config user.name "Troll Engine yuuki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "公開ページは更新済みです。"
            exit 0
          fi
          git commit -m "Publish Troll Engine v4.17 to GitHub Pages"
          git pull --rebase origin main
          git push origin main
