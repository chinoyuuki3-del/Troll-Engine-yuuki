name: Troll Engine yuuki owner control

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      action:
        description: Owner Studio action
        required: true
        default: admin_posts_replace
        type: choice
        options:
          - admin_posts_replace
      payload_field:
        description: Payload encoding field
        required: true
        default: ADMIN_POSTS_GZIP_B64
        type: choice
        options:
          - ADMIN_POSTS_GZIP_B64
          - ADMIN_POSTS_JSON_B64
      payload:
        description: Base64URL management payload
        required: true
        type: string
      message:
        description: Commit message
        required: false
        default: Troll Engine 管理更新
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: troll-engine-yuuki-owner-control
  cancel-in-progress: false

jobs:
  update-management:
    if: github.actor == 'chinoyuuki3-del' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[Troll管理]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate owner command from issue
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if printf '%s\n' "$ISSUE_BODY" | grep -q '^ACTION: aft_video_publish'; then
            python3 scripts/aft-video-publish.py
          elif printf '%s\n' "$ISSUE_BODY" | grep -Eq '^ACTION: public_world_(publish|delete)'; then
            python3 scripts/public-world-publish.py
          elif printf '%s\n' "$ISSUE_BODY" | grep -q '^ACTION: admin_posts_replace'; then
            python3 scripts/admin-posts-publish.py
          elif printf '%s\n' "$ISSUE_BODY" | grep -q '^ACTION: publish_owner_studio'; then
            python3 scripts/apply-admin-studio-v425.py
          else
            python3 scripts/admin-control.py
          fi

      - name: Apply Owner Studio direct dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          OWNER_ACTION: ${{ inputs.action }}
          OWNER_PAYLOAD_FIELD: ${{ inputs.payload_field }}
          OWNER_PAYLOAD: ${{ inputs.payload }}
          OWNER_MESSAGE: ${{ inputs.message }}
          ISSUE_NUMBER: workflow-dispatch
        run: |
          if [ "$OWNER_ACTION" != "admin_posts_replace" ]; then
            echo "Unsupported Owner Studio action: $OWNER_ACTION" >&2
            exit 1
          fi
          case "$OWNER_PAYLOAD_FIELD" in
            ADMIN_POSTS_GZIP_B64|ADMIN_POSTS_JSON_B64) ;;
            *) echo "Unsupported payload field" >&2; exit 1 ;;
          esac
          ISSUE_BODY="$(printf 'ACTION: admin_posts_replace\n%s: %s\nENGINE_VERSION: 4.26.1\nMESSAGE: %s\n' "$OWNER_PAYLOAD_FIELD" "$OWNER_PAYLOAD" "$OWNER_MESSAGE")"
          export ISSUE_BODY
          python3 scripts/admin-posts-publish.py

      - name: Commit management data
        run: |
          git config user.name "Troll Engine yuuki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data index.html
          git diff --cached --quiet || git commit -m "Troll Engine yuuki 管理更新"
          git push

      - name: Close command
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          gh issue comment "$ISSUE_URL" --body "管理操作を反映しました。端末側は約15秒ごとに確認します。"
          gh issue close "$ISSUE_URL" --reason completed
